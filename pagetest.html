    let currentQuestions = [];

    // 題庫控制區收合 / 展開
    (function initControlCollapse() {
      var toggle = document.getElementById('control-toggle');
      var panel = document.getElementById('control-panel');
      var icon = document.getElementById('control-toggle-icon');
      var select = document.getElementById('year-select');
      var summary = document.getElementById('control-summary');

      if (!toggle || !panel || !icon || !select || !summary) {
        return;
      }

      function updateSummary() {
        var option = select.options[select.selectedIndex];
        summary.textContent = '目前：' + (option ? option.text : '未選擇');
      }

      function setCollapsed(collapsed) {
        panel.classList.toggle('hidden', collapsed);
        icon.classList.toggle('rotate-180', !collapsed);
        toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      }

      toggle.addEventListener('click', function() {
        setCollapsed(!panel.classList.contains('hidden'));
      });

      select.addEventListener('change', updateSummary);
      updateSummary();

      // 手機預設收合，桌機預設展開
      setCollapsed(window.innerWidth < 768);
    })();

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getQuestionDisplayNo(item, index, selectYear) {
      if (selectYear === 'all' && item.year) {
        return item.year + ' 年第 ' + item.num + ' 題';
      }
      return '第 ' + (index + 1) + ' 題';
    }

    function loadExam() {
      var selectYear = document.getElementById('year-select').value;
      var container = document.getElementById('quiz-container');
      var actionBar = document.getElementById('action-bar');
      var scoreBoard = document.getElementById('score-board');
      var questionCount = document.getElementById('question-count');

      container.innerHTML = '';
      scoreBoard.classList.add('hidden');

      if (selectYear === 'all') {
        currentQuestions = [];
        Object.keys(examData).forEach(function(year) {
          examData[year].forEach(function(item) {
            var copy = Object.assign({}, item);
            copy.year = year;
            currentQuestions.push(copy);
          });
        });
      } else {
        currentQuestions = examData[selectYear] || [];
      }

      questionCount.textContent = '目前題數：' + currentQuestions.length;

      if (currentQuestions.length === 0) {
        container.innerHTML = '<div class="bg-white rounded-2xl p-8 text-center text-slate-500 shadow-sm border border-slate-200">目前該年度沒有題庫資料。</div>';
        actionBar.classList.add('hidden');
        return;
      }

      currentQuestions.forEach(function(item, index) {
        var optionsHtml = '';

        item.options.forEach(function(opt, optIndex) {
          var optNum = optIndex + 1;
          optionsHtml += '<label class="flex items-start space-x-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition option-label-' + index + '" data-question="' + index + '" data-option="' + optNum + '">' +
            '<input type="radio" name="q_' + index + '" value="' + optNum + '" class="mt-1 text-indigo-600 focus:ring-indigo-500 h-4 w-4">' +
            '<span class="text-sm sm:text-base text-slate-700">' + escapeHtml(opt) + '</span>' +
          '</label>';
        });

        var imageHtml = '';
        if (item.image) {
          imageHtml = '<img src="' + item.image + '" alt="原試題圖示" class="question-image" loading="lazy">';
        }

        var card = document.createElement('div');
        card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-6 question-card';
        card.id = 'question-card-' + index;
        card.innerHTML = '<div class="flex items-start justify-between gap-4 mb-4">' +
          '<h3 class="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed">' +
            '<span class="bg-indigo-100 text-indigo-700 text-sm font-bold px-2.5 py-1 rounded-lg mr-2 inline-block">' + escapeHtml(getQuestionDisplayNo(item, index, selectYear)) + '</span>' +
            escapeHtml(item.q) +
          '</h3>' +
        '</div>' +
        imageHtml +
        '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4" id="options-group-' + index + '">' + optionsHtml + '</div>' +
        '<div id="feedback-' + index + '" class="mt-4 hidden text-sm font-semibold p-3 rounded-xl"></div>';

        container.appendChild(card);

        // 選完答案後立即顯示正確答案與作答結果
        var radios = card.querySelectorAll('input[type="radio"][name="q_' + index + '"]');
        radios.forEach(function(radio) {
          radio.addEventListener('change', function() {
            var userSelected = parseInt(this.value, 10);
            showQuestionAnswer(index, item, userSelected);
          });
        });
      });

      actionBar.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 即時顯示單題答案，仍保留可重新選擇答案的功能
    function showQuestionAnswer(index, item, userSelected) {
      var feedbackEl = document.getElementById('feedback-' + index);
      var optionLabels = document.querySelectorAll('.option-label-' + index);

      if (!feedbackEl) {
        return;
      }

      optionLabels.forEach(function(label) {
        label.classList.remove('border-emerald-500', 'bg-emerald-50', 'border-rose-500', 'bg-rose-50');
        var span = label.querySelector('span');
        if (span) {
          span.classList.remove('text-rose-600', 'font-bold', 'text-emerald-700');
        }
      });

      feedbackEl.classList.remove('hidden');

      if (userSelected === item.ans) {
        feedbackEl.className = 'mt-4 text-sm font-semibold p-3 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200';
        feedbackEl.textContent = '✓ 答對了！正確答案是：' + item.options[item.ans - 1];
      } else {
        feedbackEl.className = 'mt-4 text-sm font-semibold p-3 rounded-xl bg-rose-50 text-rose-600 border border-rose-200';
        feedbackEl.textContent = '✕ 答錯了！正確答案是：' + item.options[item.ans - 1];
      }

      optionLabels.forEach(function(label) {
        var optVal = parseInt(label.dataset.option, 10);
        var span = label.querySelector('span');

        if (optVal === userSelected && userSelected !== item.ans) {
          label.classList.add('border-rose-500', 'bg-rose-50');
          if (span) {
            span.classList.add('text-rose-600', 'font-bold');
          }
        }

        if (optVal === item.ans) {
          label.classList.add('border-emerald-500', 'bg-emerald-50');
          if (span) {
            span.classList.add('text-emerald-700', 'font-bold');
          }
        }
      });
    }

    function submitExam() {
      var correctCount = 0;
      var total = currentQuestions.length;

      currentQuestions.forEach(function(item, index) {
        var radios = document.getElementsByName('q_' + index);
        var userSelected = null;
        var r;

        for (r = 0; r < radios.length; r++) {
          if (radios[r].checked) {
            userSelected = parseInt(radios[r].value, 10);
            break;
          }
        }

        var feedbackEl = document.getElementById('feedback-' + index);
        feedbackEl.classList.remove('hidden');

        var optionLabels = document.querySelectorAll('.option-label-' + index);
        optionLabels.forEach(function(label) {
          label.classList.remove('border-emerald-500', 'bg-emerald-50', 'border-rose-500', 'bg-rose-50');
          var span = label.querySelector('span');
          span.classList.remove('text-rose-600', 'font-bold', 'text-emerald-700');
        });

        if (userSelected === item.ans) {
          correctCount++;
          feedbackEl.className = 'mt-4 text-sm font-semibold p-3 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200';
          feedbackEl.textContent = '✓ 答對了！正確答案是：' + item.options[item.ans - 1];

          optionLabels.forEach(function(label) {
            if (parseInt(label.dataset.option, 10) === item.ans) {
              label.classList.add('border-emerald-500', 'bg-emerald-50');
              label.querySelector('span').classList.add('text-emerald-700', 'font-bold');
            }
          });
        } else {
          feedbackEl.className = 'mt-4 text-sm font-semibold p-3 rounded-xl bg-rose-50 text-rose-600 border border-rose-200';

          if (userSelected === null) {
            feedbackEl.textContent = '✕ 未作答！正確答案是：' + item.options[item.ans - 1];
          } else {
            feedbackEl.textContent = '✕ 答錯了！正確答案是：' + item.options[item.ans - 1];
          }

          optionLabels.forEach(function(label) {
            var optVal = parseInt(label.dataset.option, 10);
            var span = label.querySelector('span');

            if (optVal === userSelected) {
              label.classList.add('border-rose-500', 'bg-rose-50');
              span.classList.add('text-rose-600', 'font-bold');
            }

            if (optVal === item.ans) {
              label.classList.add('border-emerald-500', 'bg-emerald-50');
              label.querySelector('span').classList.add('text-emerald-700', 'font-bold');
            }
          });
        }
      });

      var finalScore = total > 0 ? Math.round((correctCount / total) * 100) : 0;
      document.getElementById('current-score').innerText = finalScore;
      var scoreBoard = document.getElementById('score-board');
      scoreBoard.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetExam() {
      loadExam();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = function() {
      loadExam();
    };
  </script>
</body>
</html>
